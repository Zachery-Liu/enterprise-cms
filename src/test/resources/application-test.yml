spring:
  datasource:
    url: jdbc:h2:mem:cms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  main:
    web-application-type: none
mybatis-plus:
  mapper-locations: classpath*:mapper/identity/*.xml
  configuration:
    map-underscore-to-camel-case: true
