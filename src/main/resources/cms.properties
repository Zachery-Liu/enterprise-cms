cms.db.url=${CMS_DB_URL:jdbc:mysql://127.0.0.1:3306/enterprise_cms?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
cms.db.username=${CMS_DB_USER:cms_app}
cms.db.password=${CMS_DB_PASSWORD:}
cms.db.driver=com.mysql.cj.jdbc.Driver
cms.registration.default-role-code=${CMS_REGISTRATION_DEFAULT_ROLE:USER}
cms.session.timeout-minutes=30
cms.session.cookie-secure=${CMS_SESSION_COOKIE_SECURE:false}
